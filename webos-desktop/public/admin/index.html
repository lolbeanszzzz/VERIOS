<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERI OS PIN Admin</title><style>body{margin:0;background:#16131f;color:#f4efff;font:16px system-ui;padding:32px}main{max-width:760px;margin:auto;background:#241d32;border:1px solid #514266;border-radius:16px;padding:28px}h1{margin-top:0}form{display:grid;gap:12px;margin:20px 0}input,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #66527f;background:#181320;color:inherit}button{background:#8455d6;cursor:pointer}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #403550}.muted{color:#b7aaca}.error{color:#ff9b9b}</style></head>
<body><main><h1>VERI OS PIN Admin</h1><p class="muted">Create, revoke, restore, and delete desktop unlock PINs.</p><section id="login"><form id="login-form"><input id="password" type="password" placeholder="Admin password" required><button>Sign in</button></form></section><section id="panel" hidden><form id="pin-form"><input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Six digit PIN" required><input id="label" placeholder="Label"><input id="expires" type="datetime-local"><button>Create PIN</button></form><p id="message" class="error"></p><div id="pins"></div></section></main><script>let token="";const $=id=>document.getElementById(id);const request=(url,options={})=>fetch(url,{...options,headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`,...options.headers}}).then(async r=>{const data=await r.json();if(!r.ok)throw Error(data.error||"Request failed");return data});function showError(error){$("message").textContent=error.message}async function load(){const data=await request("/api/pins");$("pins").innerHTML=data.pins.map(pin=>`<div class="row"><span><strong>${pin.label||"Unlabeled"}</strong><br><small class="muted">Created ${new Date(pin.created_at).toLocaleString()}${pin.expires_at?` · Expires ${new Date(pin.expires_at).toLocaleString()}`:""}</small></span><span><button data-action="${pin.revoked_at?"restore":"revoke"}" data-id="${pin.id}">${pin.revoked_at?"Restore":"Revoke"}</button> <button data-action="delete" data-id="${pin.id}">Delete</button></span></div>`).join("")}$("login-form").onsubmit=async e=>{e.preventDefault();try{const data=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d});token=data.token;$("login").hidden=true;$("panel").hidden=false;await load()}catch(error){showError(error)}};$("pin-form").onsubmit=async e=>{e.preventDefault();try{await request("/api/pins",{method:"POST",body:JSON.stringify({pin:$("pin").value,label:$("label").value,expiresAt:$("expires").value?new Date($("expires").value).toISOString():null})});e.target.reset();showError({message:""});await load()}catch(error){showError(error)}};$("pins").onclick=async e=>{const button=e.target.closest("button[data-id]");if(!button)return;try{if(button.dataset.action==="delete"&&!window.confirmationApproved){window.confirmationApproved=true;button.textContent="Confirm delete";setTimeout(()=>{window.confirmationApproved=false;load()},3000);return}window.confirmationApproved=false;await request("/api/pins",{method:button.dataset.action==="delete"?"DELETE":"PATCH",body:JSON.stringify(button.dataset.action==="delete"?{id:button.dataset.id}:{id:button.dataset.id,action:button.dataset.action})});await load()}catch(error){showError(error)}};</script></body></html>
